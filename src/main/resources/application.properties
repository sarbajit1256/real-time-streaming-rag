spring.application.name=realtime-streaming-rag
server.port=${PORT:8080}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=rag-ingestion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.topic=${KAFKA_TOPIC:rag-knowledge-events}




# ----------------------------------------------------
# Groq Chat Synthesis
# ----------------------------------------------------
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7

# Prevent retrying on non-transient API errors
spring.ai.retry.max-attempts=1

# ----------------------------------------------------
# ONNX Transformers Local Embeddings
# ----------------------------------------------------
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.tokenizer.options.padding=true

# Exclude OpenAI embedding auto-config collision
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration


# ----------------------------------------------------
# Qdrant Cloud Vector Store
# ----------------------------------------------------
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:2cc3ab7b-d70f-4b6b-a9a6-c867f155be8a.eu-central-1-0.aws.cloud.qdrant.io}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6MWI4YWNmZGQtMmRhZi00Y2M3LWFiMGMtYjAwYzUyNzJkZTAxIn0._F70RykQZm8fhPx9sa8GdbJ7DDijkVXVOK3k04ORYnw}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:true}
spring.ai.vectorstore.qdrant.collection-name=streaming-knowledge
spring.ai.vectorstore.qdrant.initialize-schema=true

# Uploads / UI
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health,info

app.vectorstore.diagnostic.enabled=true

# ----------------------------------------------------
# OCR (Optical Character Recognition) Configuration
# ----------------------------------------------------
app.ocr.enabled=true
app.ocr.language=eng
app.ocr.dpi=200
app.ocr.min-text-length=20
# Optional custom tessdata path (if empty, automatically extracts bundled tessdata)
app.ocr.tessdata-path=
