spring.application.name=realtime-streaming-rag
server.port=${PORT:8080}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=rag-ingestion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.topic=${KAFKA_TOPIC:rag-knowledge-events}




# ----------------------------------------------------
# Groq Chat Synthesis
# ----------------------------------------------------
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7

# Prevent retrying on non-transient API errors
spring.ai.retry.max-attempts=1

# ----------------------------------------------------
# ONNX Transformers Local Embeddings
# ----------------------------------------------------
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.tokenizer.options.padding=true

# Exclude OpenAI embedding auto-config collision
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration


# ChromaDB
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=streaming-knowledge
spring.ai.vectorstore.chroma.initialize-schema=true

# Uploads / UI
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health,info

app.chroma.diagnostic.enabled=true

# ----------------------------------------------------
# OCR (Optical Character Recognition) Configuration
# ----------------------------------------------------
app.ocr.enabled=true
app.ocr.language=eng
app.ocr.dpi=200
app.ocr.min-text-length=20
# Optional custom tessdata path (if empty, automatically extracts bundled tessdata)
app.ocr.tessdata-path=
