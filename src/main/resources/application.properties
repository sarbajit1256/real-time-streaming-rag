
spring.application.name=realtime-streaming-rag

server.port=${PORT:8080}


# ====================================================
# KAFKA - NTAIL
# ====================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:realtime-streaming-rag.eu.cluster.ntail.io:9092}

spring.kafka.consumer.group-id=rag-ingestion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topic=${KAFKA_TOPIC:rag-knowledge-events}


# ====================================================
# KAFKA SECURITY - NTAIL (SASL/PLAIN)
# ====================================================

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN

spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:default}" password="${KAFKA_PASSWORD}";


# ====================================================
# GROQ CHAT MODEL
# ====================================================

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.base-url=https://api.groq.com/openai

spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}

spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7

spring.ai.retry.max-attempts=1


# ====================================================
# LOCAL ONNX TRANSFORMER EMBEDDINGS
# ====================================================

spring.ai.model.embedding=transformers

spring.ai.embedding.transformer.tokenizer.options.padding=true

# Prevent OpenAI embedding auto-configuration conflicts
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration


# ====================================================
# QDRANT CLOUD VECTOR DATABASE
# ====================================================

spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}

spring.ai.vectorstore.qdrant.collection-name=streaming-knowledge
spring.ai.vectorstore.qdrant.use-tls=true
spring.ai.vectorstore.qdrant.initialize-schema=true


# ====================================================
# FILE UPLOADS AND THYMELEAF
# ====================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

spring.thymeleaf.cache=false


# ====================================================
# ACTUATOR
# ====================================================

management.endpoints.web.exposure.include=health,info


# ====================================================
# OCR
# ====================================================

app.ocr.enabled=true
app.ocr.language=eng
app.ocr.dpi=200
app.ocr.min-text-length=20
app.ocr.tessdata-path=
